<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Form</h2>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required>

        <br><br>

        <input type="text"
               name="contact"
               placeholder="Enter Contact Info"
               required>

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
